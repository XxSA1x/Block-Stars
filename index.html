<style>

#play{position:absolute;right:16px;bottom:16px;background:linear-gradient(#ffe45c,#f5a300);color:#fff;font-size:clamp(26px,5vw,40px);padding:12px 38px;border-radius:14px}
.st{display:none;position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.35)}

.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#3f78ee,#1c3fa8 70%);overflow:hidden;text-align:left}.scr[hidden]{display:none}.scr,.scr *{touch-action:pan-x pan-y}

.bd{flex:1;overflow:auto;padding:16px}.pl{background:#1a2a63;border:3px solid #000;border-radius:10px;padding:6px 14px;font-size:clamp(14px,2.6vw,22px)}

.pf{display:flex;gap:18px;flex-wrap:wrap;max-width:900px;margin:0 auto}.av{width:min(34vw,180px);aspect-ratio:1;border:4px solid #000;border-radius:14px;background:linear-gradient(#ffb23c,#d94f1a);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.av img{height:100%}.pi{flex:1;min-width:220px}.tag{margin:8px 0;color:#ffd23c;font-size:20px}.x2{background:#2b9b4a;font-size:20px;padding:6px 26px;border-radius:10px}

.bg2{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:900px;margin:0 auto}.bc{position:relative;border:4px solid #000;border-radius:12px;overflow:hidden;aspect-ratio:3/4;display:flex;flex-direction:column;cursor:pointer}.bc .pt{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center}.bc .pt img{height:100%;max-width:100%;object-fit:contain}.bc .nm2{background:#3a1a55;padding:6px;text-align:center;font-size:clamp(14px,2.6vw,22px)}.bc.lk .pt img{filter:brightness(0) opacity(.5)}.bc.lk:after{content:'\1F512';position:absolute;top:8px;right:10px;font-size:26px}.bc.on{outline:5px solid #ffd23c;outline-offset:-5px}.bc.so{background:#2a3560;cursor:default}.bc.so .pt{align-items:center;font-size:clamp(18px,3vw,28px);color:#ffd23c}

function renderPicks(){let n=0;const ks=Object.keys(B),cards=ks.map(t=>{const own=OWN(t);if(own)n++;return '<div class="bc'+(own?'':' lk')+(sel==t?' on':'')+'" data-b="'+(own?t:'')+'" style="background:'+(own?'linear-gradient('+BC[t]+',#1a2a63)':'#2a3560')+'"><div class="pt">'+pic(t)+'</div><div class="nm2 t">'+(own?B[t].n:'???')+'</div></div>'});$('bp').innerHTML=hdr('bp',n+' из '+ks.length+' бойцов','')+'<div class="bd"><div class="bg2">'+cards.join('')+'<div class="bc so"><div class="pt t">SOON</div></div>'.repeat(4)+'</div></div>'}
function renderProfile(){const ks=Object.keys(B),own=ks.filter(OWN).length;if(!sv.tag){sv.tag=Math.random().toString(36).slice(2,10).toUpperCase();save()}const tiles=['Максимум трофеев','Высший ранг','Текущий ранг','Побед в 3 на 3','Одиночных побед','Парных побед','Серия побед','Клуб'].map(x=>'<div class="tile">'+x+'</div>').join('');$('pp').innerHTML=hdr('pp','Профиль','<div class="pl t">Бойцы ('+own+'/'+ks.length+')</div>')+'<div class="bd"><div class="pf"><div class="av">'+pic(sel)+'</div><div class="pi"><input id="nick" maxlength="12" placeholder="Твой ник" value="'+esc(sv.name)+'" autocomplete="off"><div class="tag t">#'+sv.tag+'</div><button class="x2 t" data-nk="1">Сохранить</button></div></div><div class="tl2">'+tiles+'</div></div>'}
function openScr(id){for(const x of SCR)$(x).hidden=x!=id;({sp:renderShop,bp:renderPicks,pp:renderProfile,ms:renderModes})[id]()}
function closeScr(id){$(id).hidden=true}
function rewardHTML(x){if(x.k=='c'){let p='';for(let i=0;i<Math.min(x.n+3,9);i++)p+='<i class="coin" style="left:'+(24+(i%4)*46+(i>>2)*22)+'px;top:'+(104-(i>>2)*40-(i%2)*12)+'px"></i>';return '<div id="ctt" class="t">МОНЕТЫ</div><div class="pile">'+p+'</div><div id="cx" class="t">x '+x.n+'</div>'}if(x.k=='e'){let p='';for(let i=0;i<x.n+1;i++)p+='<i class="em" style="left:'+(60+i*70)+'px;top:'+(60+(i%2)*26)+'px"></i>';return '<div id="ctt" class="t">ИЗУМРУДЫ</div><div class="pile">'+p+'</div><div id="cx" class="t">x '+x.n+'</div>'}return '<div id="ctt" class="t">НОВЫЙ БОЕЦ!</div><div class="pf2">'+pic(x.t)+'</div><div id="cx" class="t">'+B[x.t].n+'</div>'}
function drawCrate(){const c=CI,rem=c.it.length-(c.i+1),nx=c.it[c.i+1];$('cr').innerHTML='<div id="cbg"></div><div id="cst">'+(c.i<0?'<img id="cim" src="'+(c.big?IMG.bc:IMG.sc)+'">':rewardHTML(c.it[c.i]))+'</div><div id="chint" class="t">'+(c.i<0?'Жми Жми!':'Нажми, чтобы продолжить')+'</div><div id="crem" class="t">ОСТАЛОСЬ ПРЕДМЕТОВ: <span id="crn"'+(nx&&nx.k=='b'?' class="bl"':'')+'>'+rem+'</span></div>'}
function openCrate(big){sv.coins-=big?10:5;const it=[{k:'c',n:big?1+(Math.random()*5|0):1+(Math.random()*3|0)}];if(big)it.push({k:'e',n:1+(Math.random()*2|0)});const lk=['spike','colt'].filter(t=>!OWN(t));if(Math.random()<(big?.2:.05)&&lk.length)it.push({k:'b',t:lk[Math.random()*lk.length|0]});for(const x of it){if(x.k=='c')sv.coins+=x.n;else if(x.k=='e')sv.em+=x.n;else{sv[x.t]=true;sv.nw=true}}save();wal();renderShop();CI={big,it,i:-1,busy:false};$('cr').hidden=false;drawCrate()}
function crateTap(){const c=CI;if(!c||c.busy)return;if(c.i<0){c.busy=true;const im=$('cim');im.classList.add('shk');setTimeout(()=>{im.classList.remove('shk');im.src=c.big?IMG.bo:IMG.so;im.style.animation='pop .35s'},550);setTimeout(()=>{c.i=0;c.busy=false;drawCrate()},1000);return}if(c.i+1<c.it.length){c.i++;drawCrate()}else{$('cr').hidden=true;{const bb=c.it.find(x=>x.k=='b');if(bb)setSel(bb.t)}CI=null}}
function buy(x){const big=x.dataset.buy=='b';if(sv.coins<(big?10:5)){x.classList.remove('sh');void x.offsetWidth;x.classList.add('sh');return}openCrate(big)}
{const ms=document.createElement('div');ms.id='ms';ms.hidden=true;$('menu').append(ms)}
for(const id of SCR)$(id).className='scr';$('cr').className='scr';
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let x;if(x=q('[data-x]'))closeScr(x.dataset.x);else if(x=q('[data-m]')){setMode(x.dataset.m);closeScr('ms')}else if(x=q('[data-b]')){if(x.dataset.b){setSel(x.dataset.b);closeScr('bp')}}else if(x=q('[data-buy]'))buy(x);else if(q('[data-nk]')){sv.name=$('nick').value.replace(/[<>&"']/g,'').trim().slice(0,12);save();pnm();closeScr('pp')}else if(q('#cr'))crateTap()});
addEventListener('keydown',e=>{if(e.code=='Escape'&&$('cr').hidden)for(const x of SCR)closeScr(x);if(e.code=='Enter'&&e.target.id=='nick'){const b=document.querySelector('[data-nk]');if(b)b.click()}});
addEventListener('wheel',e=>{const g=e.target.closest('.mg,.sg');if(g&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){g.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
$('mcur').onclick=()=>openScr('ms');$('bs').onclick=()=>openScr('sp');$('bb').onclick=()=>{sv.nw=false;save();wal();openScr('bp')};$('pb').onclick=()=>openScr('pp');
portraits();
renderPicks();setSel('shelly');wal();pnm();setMode('show');
{const sp=$('splash'),fl=$('sfill'),pc=$('spc'),pb=$('sPlay'),rot=$('rot'),K=[[0,0],[1.2,13],[1.3,48],[2.4,67],[2.5,93],[3.6,100]],t0=performance.now();let pressed=false,gone=false;const pphone=()=>touch&&innerHeight>innerWidth;
function tick(){const t=(performance.now()-t0)/1000;let p=100;for(let i=1;i<K.length;i++)if(t<K[i][0]){const a=K[i-1],b=K[i];p=a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]);break}fl.style.width=p+'%';pc.textContent=Math.floor(p)+'%';if(p<100)requestAnimationFrame(tick);else{$('sbar').hidden=true;pb.hidden=false}}
tick();
function check(){if(!gone){if(!pressed)return;if(pphone())rot.hidden=false;else{rot.hidden=true;gone=true;sp.remove()}}else rot.hidden=!pphone()}
pb.onclick=()=>{pressed=true;try{const el=document.documentElement,r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.then)r.then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}catch(_){}check()};
addEventListener('resize',check);addEventListener('orientationchange',()=>setTimeout(check,200))}
const clk=new THREE.Clock();(function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clk.getDelta());if(state=='menu'){mm.rotation.y+=dt*.9;rd.render(msc,mcam)}else{upd(dt);rd.render(sc,cam)}})();
